name: Validate Docker Compose

on:
  pull_request:
    branches:
      - main

  # Rebase merges put commits on main that no pull_request run ever saw, and a
  # release tag can then point at a commit carrying no recorded verdict. Running
  # on the push closes that gap from both ends: every commit that lands on main,
  # and every v* tag, gets its own result attached to its own ref.
  push:
    branches:
      - main
    tags:
      - 'v*'

  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Compose files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose files
        run: |
          docker compose --env-file unraid/.env.example \
            -f unraid/edge/compose.yml config --quiet

          docker compose --env-file unraid/.env.example \
            -f unraid/apps/compose.yml config --quiet

          docker compose --env-file unraid/.env.example \
            -f unraid/servarr/compose.yml config --quiet

          docker compose --env-file nas/.env.example \
            -f nas/plex/compose.yml config --quiet

          docker compose --env-file nas/.env.example \
            -f nas/arcane/compose.yml config --quiet

  env-templates:
    name: Validate env templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # `docker compose config` exits 0 on an unset variable, interpolating a
      # blank string, so parsing alone cannot catch an incomplete template.
      - name: Check for missing or empty variables
        run: .github/ci/check-env-templates.sh
