name: Lint

on:
  pull_request:
    branches:
      - main

  # Rebase merges put commits on main that no pull_request run ever saw, and a
  # release tag can then point at a commit carrying no recorded verdict. Running
  # on the push closes that gap from both ends: every commit that lands on main,
  # and every v* tag, gets its own result attached to its own ref.
  push:
    branches:
      - main
    tags:
      - 'v*'

  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Pinned via `docker://` so Dependabot's github-actions ecosystem keeps it
      # current, without pulling a JavaScript action into the supply chain.
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
